<body>
    <div id="status">
        <div class="spinner"></div>
        <div class="s-title">Cargando:CANALES VARIOS HD</div>

    <div id="player" class="bitmovinplayer-container" style="width: 100%; height: 100%;"><video id="bitmovinplayer-video-player" webkit-playsinline="" playsinline=""></video></div>

   
    <script>
        /* ════════════════════════════════════════════════════════
         * Interceptar licencia Bitmovin
         * ════════════════════════════════════════════════════════ */
        (function () {
            var GRANT = 'data:text/plain;charset=utf-8;base64,eyJzdGF0dXMiOiJncmFudGVkIiwibWVzc2FnZSI6IlRoZXJlIHlvdSBnby4ifQ==';
            function override(u) {
                var wm = document.querySelector('button.bmpui-ui-watermark');
                if (wm) wm.setAttribute('disabled', 'disabled');
                if (u.indexOf('licensing.bitmovin.com/licensing') > -1) return GRANT;
                if (u.indexOf('licensing.bitmovin.com/impression') > -1) return GRANT;
                return u;
            }
            var _open = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function () {
                arguments[1] = override(arguments[1]);
                return _open.apply(this, arguments);
            };
        })();

        /* ════════════════════════════════════════════════════════
         * Helpers
         * ════════════════════════════════════════════════════════ */
        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        /* ════════════════════════════════════════════════════════
         * Configuración de canales
         * ════════════════════════════════════════════════════════ */
        var ConfiguracionCanales = {
            "teeeinseeargee": {
                url: "https://live-04-11-tyc-app-web.vodgc.net/tyc24/index.m3u8",
            },
            "dreamworks": {
                url: "https://cdn-zapster-ros.trapemn.tv:1936/CD-LATAM/dreamworks.stream/playlist.m3u8",
            },
        
            "canal26hls": {
                url: "https://stream-gtlc.telecentro.net.ar/hls/canal26hls/main.m3u8",
            },

        };

        /* ════════════════════════════════════════════════════════
         * Inicializar
         * ════════════════════════════════════════════════════════ */
        var id = getParameterByName('id');
        var config = ConfiguracionCanales[id];

        if (config) {
            var player = new bitmovin.player.Player(document.getElementById('player'), {
                key: '11d3698c-efdf-42f1-8769-54663995de2b',
                analytics: false,
                cast: { enable: true },
                playback: {autoplay: false, muted: false,stretching:'exactfit',},
                style: { width: '100%', height: '100%' }
            });

            // Armar source
            var source = {};

            if (config.url.includes('.m3u8')) {
                source.hls = config.url;
            } else {
                source.dash = config.url;
            }

            // ClearKey DRM
            if (config.clearkey) {
                var keyId = Object.keys(config.clearkey)[0];
                var key = config.clearkey[keyId];
                source.drm = {
                    clearkey: [{ keyId: keyId, key: key }]
                };
            }

            // Ocultar pantalla de carga al cargar o mostrar controles/reproducir para revelar el botón play
            var ocultarStatus = function () {
                var statusEl = document.getElementById('status');
                if (statusEl) {
                    statusEl.style.display = 'none';
                }
            };

            player.on(bitmovin.player.PlayerEvent.SourceLoaded, ocultarStatus);
            player.on(bitmovin.player.PlayerEvent.Play, ocultarStatus);
            player.on(bitmovin.player.PlayerEvent.Playing, ocultarStatus);

            // Seleccionar pista de audio en español al reproducir
            player.on(bitmovin.player.PlayerEvent.Play, function () {
                var tracks = player.getAvailableAudio();
                if (!tracks || tracks.length === 0) return;

                var spanishTrack = tracks.find(function (t) {
                    var name = (t.label || t.lang || '').toLowerCase();
                    return name.includes('spanish') || name.includes('spa') || name.includes('es');
                });

                if (spanishTrack) {
                    player.setAudio(spanishTrack.id);
                } else {
                    player.setAudio(tracks[0].id);
                }
            });

            player.load(source).catch(function (err) {
                console.error('Bitmovin load error:', err);
                ocultarStatus();
            });
        }

        /* ════════════════════════════════════════════════════════
         * Forzar rotación horizontal en Pantalla Completa
         * (Exclusivo para Celulares, Tablets e iPads)
         * ════════════════════════════════════════════════════════ */
        function esMovilOTabletValido() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/smarttv|googletv|appletv|hbbtv|netcast|viera|roku|firetv/i.test(ua)) {
                return false;
            }
            var esAndroid = /android/i.test(ua);
            var esIOS = /iphone|ipod|ipad/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
            var esMobileGenerico = /mobi|tablet|android|touch/i.test(ua);

            var esDesktopONotebook = /windows nt|macintosh|linux x86_64|cros/i.test(ua) && !esIOS && !esAndroid;
            if (esDesktopONotebook && navigator.maxTouchPoints <= 1) {
                return false;
            }

            return esAndroid || esIOS || esMobileGenerico;
        }

        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement && esMovilOTabletValido()) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {
                        console.log('No se pudo bloquear la orientación:', err);
                    });
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });
    </script>
